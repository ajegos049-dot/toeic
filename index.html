<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEIC Trainer</title>
<style>
/* VOICE: coach d'entraînement, net et encourageant
   IDEA: un carnet de bord d'examen : score, courbe, priorités
   PICTURE: la courbe de progression vers 850 et les cartes de priorités
   COLOUR and TYPE: blanc, encre, bleu écoute, orange lecture ; police système (hors ligne)
   LAYOUT: barre de navigation, héros score + courbe, sections empilées */
:root{color-scheme:light dark;--bg:light-dark(#f7f8fb,#0e1117);--card:light-dark(#fff,#161a22);--ink:light-dark(#14161c,#eef0f5);--mut:light-dark(#5d6372,#a3a9b8);--line:light-dark(#e3e6ee,#272c38);--blue:light-dark(#2f5bd3,#7d9cff);--or:light-dark(#d9662f,#ff9a66);--ok:light-dark(#1f8a5b,#4fd197);--bad:light-dark(#c8372d,#ff7b70);--soft:light-dark(#eef2fd,#1b2233);--warn:light-dark(#fff4e0,#2c2414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:8px max(4vw,12px);overflow-x:auto}
.nav .logo{font-weight:800;margin-right:14px;white-space:nowrap}.nav .logo i{font-style:normal;color:var(--blue)}
.nav a,.nav .logo{flex:none}.nav a{padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;white-space:nowrap;cursor:pointer;min-height:44px;display:flex;align-items:center}
.nav a.on{background:var(--soft);color:var(--ink);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,12px) 80px}
h2{font-size:26px;line-height:1.15;margin:28px 0 6px}h3{font-size:18px;margin:0 0 6px}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:center}
.hero>div:first-child{padding:8px 0}
.eyebrow{margin:0;font-weight:600;color:var(--blue)}
.score{font-size:clamp(52px,9vw,84px);font-weight:800;line-height:1}.score small{font-size:22px;color:var(--mut);font-weight:500}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.bar.big{height:14px;margin:14px 0}.bar.big i{background:linear-gradient(90deg,var(--blue),var(--or))}.bar.rea i{background:var(--or)}
.btn{font:inherit;font-weight:600;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:11px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cta,.exrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.chart{width:100%;height:auto;display:block}.chart .grid{stroke:var(--line)}.chart .goal{stroke:var(--or);stroke-width:2;stroke-dasharray:6 5}.chart .b2{stroke:var(--mut);stroke-dasharray:2 4}
.chart .ax{fill:var(--mut);font-size:12px}.chart .gl{fill:var(--or);font-size:12px;font-weight:700}.chart .bl{fill:var(--mut);font-size:12px}
.chart .line{fill:none;stroke:var(--blue);stroke-width:3}.chart .dot{fill:var(--blue);stroke:var(--card);stroke-width:3}.chart .val{fill:var(--ink);font-size:13px;font-weight:700}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px;margin-top:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tcard.done{border-color:var(--blue)}.tsc{font-size:30px;font-weight:800;margin:4px 0}
.rec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.rk{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rec p{margin:6px 0}.rec ul,.card ul{margin:6px 0;padding-left:20px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.pill.quick{background:light-dark(#dff5ea,#123a28);color:var(--ok)}.pill.mid{background:var(--soft);color:var(--blue)}.pill.slow{background:var(--warn);color:var(--or)}
.pill.lis{color:var(--blue)}.pill.rea{background:var(--warn);color:var(--or)}.pill.tag{font-size:12px;padding:2px 8px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.exb{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.exb b{font-size:18px}.exb small{font-size:11px;color:var(--mut);line-height:1.2}
.exb.g{border-color:var(--ok);background:light-dark(#e9f8f0,#10291d)}.exb.m{border-color:var(--blue)}.exb.b{border-color:var(--or);background:var(--warn)}
.runner .rtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.sp{flex:1}
.cd{font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;white-space:nowrap}.cd.late{color:var(--bad)}
.runner>.bar{margin-bottom:16px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card .grp{border:0;padding:0}
.scene{max-width:520px;margin:0 auto 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.scene svg{display:block;width:100%;height:auto}
.q{padding:10px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0}
.qt{font-weight:600;margin-bottom:8px;font-size:17px}.num{display:inline-block;min-width:34px;color:var(--mut);font-weight:700}
.gap{display:inline-block;width:80px;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:-2px}
.opts{display:grid;gap:8px}
.g1 .opts,.g2 .opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:46px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--blue);background:var(--soft)}.opt.sel b{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:light-dark(#e9f8f0,#10291d)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:light-dark(#fdecea,#341614)}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.ex{font-size:15px;margin:8px 0 0;color:var(--mut)}
.tr2{font-size:18px;font-weight:600;background:var(--soft);padding:10px 14px;border-radius:10px}
.trans{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:15px}.trans p{margin:4px 0}
.doc{background:light-dark(#fffdf8,#1a1d24);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:15.5px}
.doc .dt{font-size:12px;font-weight:700;color:var(--or);margin-bottom:6px}
.doc h4{margin:0 0 6px;font-size:16px}.doc p{margin:6px 0}.doc table{border-collapse:collapse;width:100%}.doc td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}.doc td.n,.tbl .n{text-align:right;white-space:nowrap}
.mh{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;font-size:14px}
.chat p{background:var(--soft);border-radius:10px;padding:6px 10px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--or);font-weight:700;color:var(--or);text-align:center}
@media(min-width:900px){.g7s,.g7m{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}.g7s .qs,.g7m .qs{position:sticky;top:76px}}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:16px 0;flex-wrap:wrap}
.pal{margin-top:8px}.pal summary{cursor:pointer;font-weight:600;min-height:32px}
.palg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.pb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:36px;cursor:pointer}.pb.a{background:var(--soft);border-color:var(--blue)}.pb.c{outline:2px solid var(--or)}
.warn{background:var(--warn);border-radius:12px;padding:12px 14px;margin:10px 0}
.pr{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) 4.5em 3em;gap:10px;align-items:center;padding:6px 0;font-size:14px}.pr b{text-align:right}.pr small{text-align:right}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.tipbox{background:var(--soft);border:0;font-size:15px}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}input[type=checkbox]{width:20px;height:20px}input[type=range]{width:200px}
.intro{max-width:760px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
@media(max-width:600px){.pr{grid-template-columns:minmax(0,1fr) 4em 3em}.pr .bar{grid-column:1/-1;grid-row:2}.rec{grid-template-columns:1fr}.rk{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<body>
<header><nav class="nav"><span class="logo">TOEIC <i>Trainer</i></span><a data-act="home">Accueil</a><a data-act="exList">Exercices</a><a data-act="meth">Méthodes</a><a data-act="settings">Réglages</a></nav></header>
<main id="app"></main>
<script>
/* ===== CORE : hasard reproductible, banques, outils ===== */
function RNG(seed){
  let s=seed>>>0;
  const f=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const r={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:a=>a[Math.floor(f()*a.length)],
    shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
    sample:(a,n)=>r.shuffle(a).slice(0,n),
    decks:{},
    draw:(key,arr)=>{let d=r.decks[key];if(!d||!d.length)d=r.decks[key]=r.shuffle(arr.map((_,i)=>i));return arr[d.pop()]}
  };
  return r;
}
const B={
  mf:["James","Daniel","Kenji","Carlos","Michael","Omar","Thomas","Ravi","Peter","Lucas","David","Samuel","Andrew","Ben"],
  ff:["Linda","Priya","Emma","Sofia","Hannah","Grace","Maria","Yuki","Rachel","Laura","Nadia","Claire","Julia","Anna"],
  ln:["Patel","Nguyen","Garcia","Thompson","Kim","Rossi","Walker","Chen","Okafor","Martin","Fischer","Silva","Brennan","Larsen","Moreau","Tanaka","Hughes","Lopez"],
  co:["Brightline Logistics","Harbor Tech","Norvale Foods","Crestwood Hotels","Pinewood Bank","Summit Office Supplies","Bluewave Media","Greenfield Motors","Atlas Engineering","Maple Consulting","Silverline Airlines","Orchid Pharmaceuticals","Redstone Publishing","Lakeside Electronics"],
  city:["Chicago","Toronto","Sydney","London","Dublin","Vancouver","Boston","Melbourne","Seattle","Manchester","Denver","Auckland","Singapore","Edinburgh"],
  day:["Monday","Tuesday","Wednesday","Thursday","Friday"],
  month:["January","February","March","April","May","June","July","August","September","October","November","December"],
  dept:["accounting","marketing","sales","human resources","customer service","shipping","research","legal"],
  prod:["laptops","office chairs","printer cartridges","kitchen appliances","running shoes","smartphones","desk lamps","coffee machines","tablets","backpacks"],
  times:["8:30 A.M.","9:00 A.M.","9:30 A.M.","10:00 A.M.","10:30 A.M.","11:00 A.M.","11:30 A.M.","1:00 P.M.","1:30 P.M.","2:00 P.M.","2:30 P.M.","3:00 P.M.","3:30 P.M.","4:00 P.M.","4:30 P.M."],
  street:["Maple","Oak","Harbor","River","King","Elm","Park","Market","Bridge","Station"],
  rest:["Bella Cucina","The Blue Fern","Golden Lantern","Riverside Grill","Casa Verde","The Copper Pot"],
  hotel:["Grand Plaza Hotel","Lakeview Inn","Riverside Suites","Hotel Meridian","Parkside Hotel"]
};
function ctx(r){
  const m=r.sample(B.mf,3),f=r.sample(B.ff,3),l=r.sample(B.ln,4),co=r.sample(B.co,3),ci=r.sample(B.city,3);
  const di=r.int(0,2),mi=r.int(0,10),ti=r.int(0,B.times.length-4);
  return {M:m[0],M2:m[1],M3:m[2],F:f[0],F2:f[1],F3:f[2],L:l[0],L2:l[1],L3:l[2],L4:l[3],CO:co[0],CO2:co[1],CO3:co[2],
    CITY:ci[0],CITY2:ci[1],CITY3:ci[2],D0:B.day[di],D1:B.day[di+1],D2:B.day[di+2],DAY:r.pick(B.day),
    MONTH:B.month[mi],MONTH2:B.month[mi+1],DEPT:r.pick(B.dept),PROD:r.pick(B.prod),
    T0:B.times[ti],T1:B.times[ti+1],T2:B.times[ti+2],T3:B.times[ti+3],
    STREET:r.pick(B.street),REST:r.pick(B.rest),HOTEL:r.pick(B.hotel),NUM:r.int(10000,99999)};
}
const fill=(s,c)=>s.replace(/\{(\w+)\}/g,(_,k)=>c[k]!==undefined?c[k]:k);
/* question à choix multiples : bonne réponse + distracteurs -> options mélangées */
function mc(r,c,ds,n=4){
  const pool=[...new Set(ds.filter(x=>x!==c))];
  const o=r.shuffle([c,...r.sample(pool,n-1)]);
  return {o,a:o.indexOf(c)};
}
function mkQ(r,q,c,ds,tag,ex,n){return Object.assign({q,tag,ex},mc(r,c,ds,n))}
const otherTimes=(c,t)=>B.times.filter(x=>x!==t);
const LET="ABCD";

/* ===== PARTIE 1 : photographies (scènes dessinées en SVG) ===== */
const SV={
  wrap:(bg,inner)=>`<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img">${bg}${inner}</svg>`,
  room:(wall,floor)=>`<rect width="400" height="260" fill="${wall}"/><rect y="200" width="400" height="60" fill="${floor}"/><rect y="198" width="400" height="4" fill="#00000018"/>`,
  outside:(sky,ground)=>`<rect width="400" height="260" fill="${sky}"/><rect y="190" width="400" height="70" fill="${ground}"/>`,
  hair(x,hy,fem,col){return fem?`<path d="M${x-15} ${hy+14}Q${x-17} ${hy-16} ${x} ${hy-15}Q${x+17} ${hy-16} ${x+15} ${hy+14}L${x+11} ${hy+2}Q${x} ${hy-6} ${x-11} ${hy+2}Z" fill="${col}"/>`:`<path d="M${x-13} ${hy-1}Q${x-13} ${hy-15} ${x} ${hy-15}Q${x+13} ${hy-15} ${x+13} ${hy-1}Q${x} ${hy-9} ${x-13} ${hy-1}Z" fill="${col}"/>`},
  arm(sx,sy,ex,ey,col,sk){return `<path d="M${sx} ${sy}L${ex} ${ey}" stroke="${col}" stroke-width="8" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="4.5" fill="${sk}"/>`},
  /* personne debout, pieds en y ; arms = [[dx,dy],[dx,dy]] fin des bras gauche/droite relative aux épaules */
  stand(x,y,o={}){
    const c=o.c||"#3b6fd4",sk=o.sk||"#e3b58f",h=o.h||"#3a2a1f",pt=o.pt||"#2f3542",hy=y-118;
    const a=o.arms||[[-6,40],[6,40]];
    return `<g><rect x="${x-13}" y="${y-60}" width="11" height="58" rx="4" fill="${pt}"/><rect x="${x+2}" y="${y-60}" width="11" height="58" rx="4" fill="${pt}"/>
    <rect x="${x-15}" y="${y-6}" width="14" height="6" rx="3" fill="#222"/><rect x="${x+1}" y="${y-6}" width="14" height="6" rx="3" fill="#222"/>
    <rect x="${x-16}" y="${y-103}" width="32" height="50" rx="10" fill="${c}"/>
    ${SV.arm(x-12,y-96,x-12+a[0][0],y-96+a[0][1],c,sk)}${SV.arm(x+12,y-96,x+12+a[1][0],y-96+a[1][1],c,sk)}
    <rect x="${x-4}" y="${y-110}" width="8" height="8" fill="${sk}"/><circle cx="${x}" cy="${hy}" r="13" fill="${sk}"/>${SV.hair(x,hy,o.f,h)}</g>`},
  /* personne assise : hanches en (x,y), regarde vers dir (1 droite / -1 gauche) */
  sit(x,y,o={}){
    const c=o.c||"#3b6fd4",sk=o.sk||"#e3b58f",h=o.h||"#3a2a1f",pt=o.pt||"#2f3542",d=o.dir||1,hy=y-64;
    const a=o.arms||[[22*d,22],[26*d,20]];
    return `<g><path d="M${x} ${y-4}L${x+30*d} ${y-4}" stroke="${pt}" stroke-width="12" stroke-linecap="round"/>
    <path d="M${x+30*d} ${y-4}L${x+30*d} ${y+42}" stroke="${pt}" stroke-width="11" stroke-linecap="round"/><rect x="${x+30*d-(d>0?4:12)}" y="${y+40}" width="16" height="6" rx="3" fill="#222"/>
    <rect x="${x-16}" y="${y-50}" width="32" height="50" rx="10" fill="${c}"/>
    ${SV.arm(x-10*d,y-44,x-10*d+a[0][0],y-44+a[0][1],c,sk)}${SV.arm(x+10*d,y-44,x+10*d+a[1][0],y-44+a[1][1],c,sk)}
    <rect x="${x-4}" y="${y-56}" width="8" height="8" fill="${sk}"/><circle cx="${x}" cy="${hy}" r="13" fill="${sk}"/>${SV.hair(x,hy,o.f,h)}</g>`},
  chair:(x,y,col)=>`<rect x="${x-18}" y="${y}" width="40" height="7" rx="3" fill="${col}"/><rect x="${x-18}" y="${y-48}" width="7" height="55" rx="3" fill="${col}"/><rect x="${x-14}" y="${y+6}" width="5" height="34" fill="${col}"/><rect x="${x+14}" y="${y+6}" width="5" height="34" fill="${col}"/>`,
  table:(x,y,w,col)=>`<rect x="${x}" y="${y}" width="${w}" height="9" rx="3" fill="${col}"/><rect x="${x+8}" y="${y+9}" width="7" height="${200-y-9+12}" fill="${col}"/><rect x="${x+w-15}" y="${y+9}" width="7" height="${200-y-9+12}" fill="${col}"/>`,

function genP1(r){

  const ds=[...r.sample(s.no,2),r.pick(others)];

  q.hide=1;
  return {p:"1",scene:SV.wrap("",s.draw(r)),audio:q.o.map((t,i)=>["N",LET[i]+". "+t]),qs:[q]};
}

const isL=p=>p==="1"||p==="2"||p==="3"||p==="4";
const P5ORD=["forme","temps","prep","conn","pron","verbe","comp","passif","vocab"];
const EXD={"1":{n:15,k:20,g:genP1,min:15},"2":{n:15,k:25,g:genP2,min:15},"3":{n:20,k:10,g:genP3,min:30},"4":{n:20,k:10,g:genP4,min:30},"5":{n:20,k:30,min:25},"6":{n:15,k:6,g:genP6,min:25},"7s":{n:10,k:9,g:r=>genP7(r,false),min:30},"7m":{n:10,k:4,g:r=>genP7(r,true),min:30}};
const METH={
"1":{why:"Seulement 6 questions, mais ce sont les plus faciles du test.",how:["Avant l'audio, décris la photo dans ta tête : qui, quelle action, quels objets.","Élimine toute phrase qui cite un objet ou une personne absente de la photo.","Méfie-toi de « is being + participe » : l'action doit être en train de se faire."]},
"2":{why:"25 questions très courtes : le premier mot de la question donne la réponse.",how:["Concentre-toi sur le premier mot : Where = lieu, When = moment, Who = personne.","Élimine les réponses qui répètent un mot de la question ou un mot qui sonne pareil.","Une réponse indirecte (« I'll check », « Ask Linda ») est souvent la bonne."]},
"3":{why:"39 questions : c'est la plus grosse partie de l'écoute.",how:["Lis les 3 questions AVANT le début de la conversation.","La bonne réponse reformule l'audio ; une option qui reprend les mots exacts est souvent un piège.","Si tu rates une question, passe tout de suite à la suivante."]},
"4":{why:"30 questions : un seul locuteur, et les mêmes types d'annonces reviennent.",how:["Lis les questions avant l'audio et repère le type de document (annonce, message vocal, publicité).","La 1re question porte souvent sur le but ou le lieu : écoute bien le début.","La dernière porte souvent sur la suite : écoute bien la fin."]},
"5":{why:"30 questions de grammaire : une dizaine de règles couvrent l'essentiel.",how:["Lis d'abord les 4 options : même racine = question de nature du mot, réponds en 10 secondes.","Regarde le mot juste avant et juste après le blanc.","Objectif : 30 questions en 10 minutes."]},
"6":{why:"16 questions qui mélangent grammaire et compréhension du texte.",how:["Lis la phrase avant ET après le blanc.","Pour les phrases à insérer, repère les liens logiques et les pronoms (It, This, However).","2 minutes maximum par texte."]},
"7s":{why:"29 questions : on progresse surtout grâce à la méthode et à la vitesse.",how:["Lis la question d'abord, puis cherche le mot-clé dans le texte.","Les questions suivent généralement l'ordre du texte.","Question NOT : vérifie les options présentes ; celle que tu ne trouves pas est la réponse."]},
"7m":{why:"25 questions difficiles : progrès plus lents, mais beaucoup de points à prendre.",how:["Lis d'abord le titre de chaque document : qui écrit, à qui, pourquoi.","Au moins une question par série demande de croiser deux documents.","Garde 55 minutes pour toute la partie 7."]}};
const TIPS={p5_forme:"Mot avant le blanc = déterminant → nom ; devant un nom → adjectif ; autour d'un verbe → adverbe en -ly.",p5_temps:"Cherche l'indicateur : since/for → present perfect ; ago/last → prétérit ; next/tomorrow → futur.",p5_prep:"Apprends les combinaisons fixes : responsible for, by + date limite, on + jour, at + heure.",p5_conn:"Regarde ce qui suit le blanc : un nom → despite / because of ; sujet + verbe → although / because.",p5_pron:"Devant un nom → possessif (their, its) ; après un verbe ou une préposition → complément (him, them).",p5_verbe:"avoid, suggest, mind, enjoy + -ing ; decide, plan, agree, allow + to ; après une préposition → -ing.",p5_comp:"than → comparatif ; the ... of/in → superlatif ; as ... as → forme simple ; fewer + pluriel.",p5_passif:"Si le sujet subit l'action (ou s'il y a « by »), c'est un passif : be + participe passé.",p5_vocab:"Révise les associations du monde du travail : attend a meeting, a wide range of, complete a form.",p7_cross:"Note l'info clé de chaque document (date, prix, nombre) : la réponse en combine deux.",p7_not:"Vérifie chaque option dans le texte : celle que tu ne trouves pas est la réponse.",p7_vocab:"Remplace le mot par chaque option dans la phrase et garde celle qui conserve le sens.",p7_intent:"Relis les messages juste avant la phrase citée : le sens dépend du contexte.",p7_inf:"La réponse n'est pas écrite mot pour mot : cherche les indices et élimine.",p7_gen:"Le but du document est presque toujours dans les deux premières phrases.",p7_det:"Repère le mot-clé de la question (nom, date, chiffre) et scanne le texte pour le trouver.",gen:"Le sujet principal est donné au début : écoute attentivement les premières phrases.",det:"Lis les questions avant l'audio pour savoir quel détail guetter (heure, lieu, chiffre).",inf:"Métiers et lieux se devinent au vocabulaire (gate, boarding → aéroport ; check-in → hôtel).",next:"La réponse arrive à la fin : « I'll... », « Let's... », « Could you... ».",photo:"Décris la photo dans ta tête avant l'audio : qui, quoi, où.",p6_phrase:"La bonne phrase reprend une idée de la phrase d'avant ET annonce celle d'après."};
const SC={L:[[0,5],[10,30],[25,110],[40,190],[50,245],[60,300],[70,355],[80,405],[90,455],[95,480],[100,495]],R:[[0,5],[10,25],[25,95],[40,170],[50,225],[60,280],[70,335],[80,390],[90,445],[95,470],[100,495]]};
const scale=(t,raw)=>{const a=SC[t];for(let i=1;i<a.length;i++)if(raw<=a[i][0]){const[x0,y0]=a[i-1],[x1,y1]=a[i];return Math.round((y0+(y1-y0)*(raw-x0)/(x1-x0))/5)*5}return 495};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const mmss=s=>`${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,"0")}`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tl(tag){if(tag==="photo")return"Description de photo";if(tag.startsWith("p2_"))return P2TAG[tag.slice(3)];if(tag.startsWith("p5_"))return P5TAG[tag.slice(3)];if(tag.startsWith("p6_"))return P6TAG[tag.slice(3)];if(tag.startsWith("p7_"))return P7TAG[tag.slice(3)];return LTAG[tag]||tag}
function tip(tag){return TIPS[tag]||(tag.startsWith("p2_")?"Écoute le premier mot de la question et élimine les réponses qui répètent ses mots ou des sons proches.":TIPS[tag.replace(/^p6_/,"p5_")]||"")}

/* ----- voix (synthèse vocale du système, hors ligne) ----- */
const FEM=/samantha|karen|moira|tessa|victoria|zira|susan|serena|fiona|kate|hazel|libby|sonia|jenny|aria|allison|ava|female|catherine|martha|nicky|joanna|salli|kendra|emma|amy|olivia|natasha|linda|heather|heera|veena|female/i;
const MAL=/daniel|alex|fred|tom|david|mark|oliver|rishi|aaron|arthur|george|guy|ryan|male|gordon|lee|james|ralph|bruce|matthew|brian|richard|william|thomas|evan|nathan/i;
const TTS={en:[],fem:[],mal:[],
  init(){if(!("speechSynthesis"in window))return;const f=()=>{let en=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));const loc=en.filter(v=>v.localService);if(loc.length)en=loc;this.en=en;this.fem=en.filter(v=>FEM.test(v.name)&&!/male/i.test(v.name.replace(/female/i,"")));this.mal=en.filter(v=>MAL.test(v.name)&&!FEM.test(v.name))};f();speechSynthesis.onvoiceschanged=f},
  ok(){return "speechSynthesis"in window&&this.en.length>0},
  stop(){try{speechSynthesis.cancel()}catch(e){}},
  assign(){const pk=a=>a[Math.floor(Math.random()*a.length)];const fem=this.fem.length?this.fem:this.en,mal=this.mal.length?this.mal:this.en;
    const W={v:pk(fem),p:this.fem.length?1:1.25},M={v:pk(mal),p:this.mal.length?1:.8};const m2=mal.filter(v=>v!==M.v);const M2={v:m2.length?pk(m2):M.v,p:m2.length?1:.95};
    return {W,M,M2,N:Math.random()<.5?W:M}},
  say(t,vp){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t.replace(/\b(Mr|Ms|Mrs|Dr)\./g,"$1").replace(/A\.M\./g,"AM").replace(/P\.M\./g,"PM"));
    if(vp&&vp.v){u.voice=vp.v;u.lang=vp.v.lang}else u.lang="en-US";u.rate=ST.set.rate;u.pitch=vp?vp.p:1;let done=false;
    const to=setTimeout(()=>fin(),(t.split(/\s+/).length*.6/ST.set.rate+4)*1000);const fin=()=>{if(!done){done=true;clearTimeout(to);res()}};
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})},
  async group(lines,alive){const vs=this.assign();for(const[sp,t]of lines){for(const s of t.split(/(?<=[.!?])\s+(?=[A-Z0-9"])/)){if(!alive())return;await this.say(s,vs[sp]||vs.N)}if(!alive())return;await sleep(400)}}
};
const textMode=()=>ST.set.text||!TTS.ok();

/* ----- construction des tests et exercices ----- */
function number(gs,start){let k=start;gs.forEach(g=>g.qs.forEach(q=>q.n=k++))}
function buildTest(n){const r=RNG(1000+n*7919),L=[],R=[];
  for(let i=0;i<6;i++)L.push(genP1(r));for(let i=0;i<25;i++)L.push(genP2(r));for(let i=0;i<13;i++)L.push(genP3(r));for(let i=0;i<10;i++)L.push(genP4(r));
  for(let i=0;i<30;i++)R.push(genP5(r));for(let i=0;i<4;i++)R.push(genP6(r));
  let s=0;while(s<29){const g=genP7(r,false);if(s+g.qs.length>29)g.qs=g.qs.slice(0,29-s);s+=g.qs.length;R.push(g)}
  for(let i=0;i<5;i++)R.push(genP7(r,true));
  number(L,1);number(R,101);return{L,R}}
function exTitle(p,i){return "Exercice "+(i+1)+(p==="5"?(i<9?" · "+P5TAG[P5ORD[i]]:" · mixte"):"")}
function buildEx(p,i){const r=RNG(50000+PARTS.indexOf(p)*1000+i*37),d=EXD[p];let gs=[];
  if(p==="5"){if(i<9){const tag=P5ORD[i],nT=P5B.filter(x=>x[0]===tag).length;for(let j=0;j<nT;j++)gs.push(genP5(r,tag))}while(gs.length<30)gs.push(genP5(r))}
  else for(let j=0;j<d.k;j++)gs.push(d.g(r));
  number(gs,1);return gs}
function evaluate(gs,ans){const parts={},tags={};let rl=0,rr=0;
  gs.forEach(g=>g.qs.forEach(q=>{const ok=ans[q.n]===q.a,k=g.p+"|"+q.tag;(parts[g.p]=parts[g.p]||[0,0])[1]++;(tags[k]=tags[k]||[0,0])[1]++;if(ok){parts[g.p][0]++;tags[k][0]++;isL(g.p)?rl++:rr++}}));
  const L=scale("L",rl),R=scale("R",rr);return{parts,tags,rl,rr,L,R,tot:L+R}}

/* ----- recommandations ----- */
function pickEx(p,weak){const d=EXD[p],list=[];
  if(p==="5")weak.forEach(w=>{const k=P5ORD.indexOf(w.tag.replace("p5_",""));if(k>=0&&!list.includes(k))list.push(k)});
  for(let i=(p==="5"?9:0);i<d.n&&list.length<3;i++)if(!ST.ex[p+"-"+i]&&!list.includes(i))list.push(i);
  if(list.length<3){const rest=[...Array(d.n).keys()].filter(i=>!list.includes(i)).sort((a,b)=>((ST.ex[p+"-"+a]||{}).best||0)-((ST.ex[p+"-"+b]||{}).best||0));list.push(...rest.slice(0,3-list.length))}
  return list.slice(0,3)}
function recs(res){const out=[];
  PARTS.forEach(p=>{const v=res.parts[p];if(!v)return;const acc=v[0]/v[1],miss=REAL[p]*(1-acc);out.push({p,acc,miss,prio:miss*EASE[p]})});
  out.sort((a,b)=>b.prio-a.prio);
  return out.map(o=>{o.weak=Object.entries(res.tags).filter(([k])=>k.split("|")[0]===o.p).map(([k,v])=>({tag:k.split("|")[1],c:v[0],t:v[1],acc:v[0]/v[1]})).filter(x=>x.t>=2&&x.acc<.75).sort((a,b)=>a.acc-b.acc).slice(0,2);
    o.ex=pickEx(o.p,o.weak);o.pts=Math.round(o.miss*.5)*5;return o})}
const easeLabel=p=>EASE[p]>=.85?["Gain rapide","quick"]:EASE[p]>=.65?["Progrès en 2-3 semaines","mid"]:["Travail de fond","slow"];
function recCard(o,k){const e=easeLabel(o.p);return `<div class="rec"><div class="rk">${k+1}</div><div class="rb">
  <div class="rh"><h3>${PN[o.p]}</h3><span class="pill ${e[1]}">${e[0]}</span></div>
  <p class="muted">Tu as eu ${Math.round(o.acc*100)} % de bonnes réponses. ${METH[o.p].why} En récupérant la moitié de tes erreurs : environ <b>+${o.pts} points</b>.</p>
  ${o.weak.length?`<p><b>À travailler en premier :</b> ${o.weak.map(w=>`${tl(w.tag)} (${w.c}/${w.t})`).join(", ")}</p><ul>${o.weak.map(w=>tip(w.tag)).filter(Boolean).map(t=>`<li>${t}</li>`).join("")}</ul>`:`<ul>${METH[o.p].how.slice(0,2).map(t=>`<li>${t}</li>`).join("")}</ul>`}
  <div class="exrow">${o.ex.map(i=>`<button class="btn sm" data-act="exGo" data-p="${o.p}" data-i="${i}">${exTitle(o.p,i)}${ST.ex[o.p+"-"+i]?` · ${ST.ex[o.p+"-"+i].best} %`:""}</button>`).join("")}</div></div></div>`}

function lastTest(){const d=Object.keys(ST.tests).map(Number).sort((a,b)=>a-b);return d.length?[d[d.length-1],ST.tests[d[d.length-1]]]:null}

function chart(){const W=640,H=250,pl=46,pr=18,pt=18,pb=36,lo=200,hi=990;
  const x=n=>pl+(n-1)*(W-pl-pr)/7,y=v=>pt+(hi-Math.max(lo,v))/(hi-lo)*(H-pt-pb);
  const pts=[];for(let n=1;n<=8;n++)if(ST.tests[n])pts.push([n,ST.tests[n].tot]);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Évolution du score">`;
  [400,600,785,850].forEach(v=>{const g=v===850?"goal":v===785?"b2":"grid";s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="${g}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`});
  s+=`<text x="${W-pr}" y="${y(850)-6}" text-anchor="end" class="gl">Objectif 850</text><text x="${W-pr}" y="${y(785)+15}" text-anchor="end" class="bl">Niveau B2 : 785</text>`;
  for(let n=1;n<=8;n++)s+=`<text x="${x(n)}" y="${H-12}" text-anchor="middle" class="ax">T${n}</text>`;
  if(pts.length>1)s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+x(p[0])+" "+y(p[1])).join("")}" class="line"/>`;
  pts.forEach(p=>{s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="6" class="dot"/><text x="${x(p[0])}" y="${y(p[1])-12}" text-anchor="middle" class="val">${p[1]}</text>`});
  if(!pts.length)s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" class="ax">Ta courbe apparaîtra après le test 1</text>`;
  return s+"</svg>"}

  const tot=lt?lt[1].tot:null,pct=tot?Math.min(100,Math.round((tot-10)/(850-10)*100)):0;
  let h=`<section class="hero"><div><p class="eyebrow">Ton score estimé${lt?" · test "+lt[0]:""}</p>
  <div class="score">${tot??`<span class="muted">?</span>`}<small> / 990</small></div>
  ${lt?`<p class="muted">Écoute ${lt[1].L} · Lecture ${lt[1].R} · encore ${Math.max(0,850-tot)} points pour 850</p>`:`<p class="muted">Passe le test 1 pour obtenir ton score de départ et tes recommandations.</p>`}
  <div class="bar big"><i style="width:${pct}%"></i></div>

  h+=`<section><h2>Les 8 tests blancs</h2><p class="muted">Un par semaine. 2 heures : 45 min d'écoute puis 75 min de lecture, 200 questions.</p><div class="tests">${[1,2,3,4,5,6,7,8].map(n=>{const t=ST.tests[n];return `<div class="tcard ${t?"done":""}"><b>Test ${n}</b><span class="muted">Semaine ${n}</span>${t?`<div class="tsc">${t.tot}</div><div class="exrow"><button class="btn sm" data-act="results" data-n="${n}">Résultats</button><button class="btn sm ghost" data-act="testIntro" data-n="${n}">Refaire</button></div>`:`<div class="tsc muted">–</div><button class="btn sm ${n===next?"":"ghost"}" data-act="testIntro" data-n="${n}">Commencer</button>`}</div>`}).join("")}</div></section>`;
  show(h,"home")}

/* ----- rendu d'un groupe de questions ----- */
const SPK={W:"Femme",M:"Homme",M2:"Homme 2",N:"Voix"};
function gHTML(g,ans,mode,reveal){
  const rq=q=>reveal===true||(mode==="P"&&ans[q.n]!==undefined);
  const grp=reveal===true||(mode==="P"&&g.qs.every(q=>ans[q.n]!==undefined));
  const tm=mode==="L"&&textMode();
  let h="";
  if(g.scene)h+=`<div class="scene">${g.scene}</div>`;
  if(g.p==="2"&&(tm||grp))h+=`<p class="tr2">${esc(g.qs[0].tr)}</p>`;
  if((g.p==="3"||g.p==="4")&&(tm||grp))h+=`<div class="trans"><div class="dt">Transcription</div>${g.audio.map(([s,t])=>`<p>${g.p==="3"?`<b>${SPK[s]} :</b> `:""}${esc(t)}</p>`).join("")}</div>`;
  if(g.doc)h+=`<div class="doc">${g.doc.replace(/\[\[(\d)\]\]/g,(_,k)=>`<span class="blank">(${g.qs[k].n})</span>`)}</div>`;
  if(g.docs)h+=`<div class="docs">${g.docs.map(d=>`<div class="doc"><div class="dt">${d.t}</div>${d.h}</div>`).join("")}</div>`;
  h+=`<div class="qs">${g.qs.map(q=>{const rv=rq(q),hid=q.hide&&!rv&&!tm;
    const qt=q.hide?"":esc(q.q).replace(/___/g,'<span class="gap"></span>');
    return `<div class="q" id="q${q.n}"><div class="qt"><span class="num">${q.n}</span>${qt}</div><div class="opts">${q.o.map((o,i)=>{let c="opt";const sel=ans[q.n]===i;if(sel)c+=" sel";if(rv){if(i===q.a)c+=" ok";else if(sel)c+=" bad"}
      return `<button class="${c}" data-act="${mode==="P"?"exAns":"ans"}" data-q="${q.n}" data-i="${i}" ${rv||mode==="V"?"disabled":""}><b>${LET[i]}</b>${hid?"":`<span>${esc(o)}</span>`}</button>`}).join("")}</div>
      ${rv?`<p class="ex"><span class="pill tag">${tl(q.tag)}</span> ${ans[q.n]===q.a?"Bonne réponse.":ans[q.n]===undefined?`Pas de réponse. Réponse : ${LET[q.a]}.`:`Réponse : ${LET[q.a]}.`} ${q.ex?esc(q.ex):""}</p>`:""}</div>`}).join("")}</div>`;
  return `<div class="grp g${g.p}">${h}</div>`}

/* ----- test : écoute ----- */
function testIntro(n){const done=ST.tests[n];
  show(`<section class="card intro"><h2>Test ${n}</h2><p>200 questions, environ 2 heures, comme le vrai TOEIC :</p>
  <ul><li><b>Écoute (≈ 45 min, 100 questions)</b> : l'audio passe une seule fois et la question suivante arrive automatiquement. Lis les questions des parties 3 et 4 pendant que l'audio démarre.</li>
  <li><b>Lecture (75 min, 100 questions)</b> : chronomètre, tu peux naviguer librement entre les questions.</li></ul>
  ${textMode()?`<p class="warn">Mode texte actif : l'audio sera affiché à l'écran au lieu d'être lu.</p>`:`<p class="muted">Mets un casque ou monte le son. Tu peux régler la vitesse des voix dans Réglages.</p>`}
  ${done?`<p class="warn">Tu as déjà fait ce test (${done.tot}). Le refaire remplacera ce score.</p>`:""}
  <div class="exrow"><button class="btn" data-act="startTest" data-n="${n}">Démarrer l'écoute</button><button class="btn ghost" data-act="home">Retour</button></div></section>`,"home")}
function persist(){if(RUN&&RUN.kind==="test"){ST.cur={n:RUN.n,phase:RUN.phase,gi:RUN.gi,ri:RUN.ri,ans:RUN.ans,rLeft:RUN.rLeft};save()}}
function startTest(n,resume){stopAll();const t=buildTest(n);
  RUN={kind:"test",n,L:t.L,R:t.R,ans:{},phase:"L",gi:0,ri:0,rLeft:75*60,tok:0};
  if(resume&&ST.cur&&ST.cur.n===n)Object.assign(RUN,{ans:ST.cur.ans||{},phase:ST.cur.phase,gi:ST.cur.gi,ri:ST.cur.ri,rLeft:ST.cur.rLeft});
  $("#app").innerHTML=`<div class="runner"><div class="rtop"><b id="rt"></b><span id="rinfo" class="muted"></span><span class="sp"></span><span id="cd" class="cd"></span><button class="btn sm ghost" data-act="pause" id="pz">Pause</button></div><div class="bar"><i id="rbar"></i></div><div id="stage"></div></div>`;
  if(RUN.phase==="L")listenLoop();else readingIntro()}
function countdown(sec,R,tok){return new Promise(res=>{let s=sec;const el=$("#cd");const up=()=>{if(el)el.innerHTML=`Suite dans ${s} s <button class="btn sm ghost" data-act="skip">Suivant</button>`};up();
  R.skip=()=>{clearInterval(R.cdv);res(true)};R.cdv=setInterval(()=>{if(RUN!==R||R.tok!==tok){clearInterval(R.cdv);res(false);return}s--;up();if(s<=0){clearInterval(R.cdv);res(true)}},1000)})}
async function listenLoop(){const R=RUN,tok=++R.tok,alive=()=>RUN===R&&R.tok===tok;
  while(R.gi<R.L.length){if(!alive())return;const g=R.L[R.gi],q0=g.qs[0].n,q1=g.qs[g.qs.length-1].n;
    $("#rt").textContent="Écoute · "+PN[g.p];$("#rinfo").textContent=`Question${q1>q0?"s "+q0+" à "+q1:" "+q0} / 100`;$("#rbar").style.width=(q0-1)+"%";$("#cd").textContent=textMode()?"":"Écoute en cours…";
    $("#stage").innerHTML=gHTML(g,R.ans,"L",false);persist();
    if(!textMode()){await sleep(g.p==="3"||g.p==="4"?2500:600);if(!alive())return;await TTS.group(g.audio,alive)}
    if(!alive())return;
    const w=textMode()?(g.p==="1"||g.p==="2"?20:60):(g.p==="1"||g.p==="2"?5:8*g.qs.length);
    if(!await countdown(w,R,tok))return;R.gi++}
  R.phase="R";persist();readingIntro()}
function readingIntro(){const R=RUN;$("#pz").style.display="none";$("#cd").textContent="";$("#rt").textContent="Fin de l'écoute";$("#rinfo").textContent="";
  $("#stage").innerHTML=`<div class="card intro"><h2>Partie lecture</h2><p>100 questions en ${mmss(R.rLeft)} minutes. Rappel : partie 5 en 10 min, partie 6 en 8 min, partie 7 en 55 min.</p><button class="btn" data-act="readGo">Démarrer la lecture</button></div>`}
function readGo(){const R=RUN;R.tok++;clearInterval(R.iv);R.iv=setInterval(()=>{if(RUN!==R)return clearInterval(R.iv);R.rLeft--;const c=$("#cd");if(c){c.textContent="Temps restant "+mmss(R.rLeft);c.classList.toggle("late",R.rLeft<600)}if(R.rLeft%5===0)persist();if(R.rLeft<=0)finishTest()},1000);drawR()}
function drawR(){const R=RUN,g=R.R[R.ri],q0=g.qs[0].n,q1=g.qs[g.qs.length-1].n,answered=Object.keys(R.ans).filter(k=>k>100).length;
  $("#rt").textContent="Lecture · "+PN[g.p];$("#rinfo").textContent=`Question${q1>q0?"s "+q0+" à "+q1:" "+q0} · ${answered}/100 répondues`;$("#rbar").style.width=answered+"%";
  $("#stage").innerHTML=`${gHTML(g,R.ans,"R",false)}<div class="rnav"><button class="btn ghost" data-act="rnav" data-d="-1" ${R.ri?"":"disabled"}>Précédent</button><button class="btn ghost" data-act="finAsk">Terminer le test</button><button class="btn" data-act="rnav" data-d="1" ${R.ri<R.R.length-1?"":"disabled"}>Suivant</button></div><div id="fin"></div>
  <details class="pal"><summary>Toutes les questions</summary><div class="palg">${R.R.map((gg,gi)=>gg.qs.map(q=>`<button class="pb ${R.ans[q.n]!==undefined?"a":""} ${gi===R.ri?"c":""}" data-act="rgo" data-g="${gi}">${q.n}</button>`).join("")).join("")}</div></details>`;
  persist()}
function finishTest(){const R=RUN;if(!R)return;const res=evaluate([...R.L,...R.R],R.ans);ST.tests[R.n]=Object.assign(res,{date:Date.now(),ans:R.ans});ST.cur=null;save();results(R.n)}

/* ----- résultats et correction ----- */
function results(n){const t=ST.tests[n];if(!t)return home();const prev=[...Array(n-1).keys()].map(i=>i+1).reverse().find(i=>ST.tests[i]),pv=prev?ST.tests[prev]:null;
  const rs=recs(t),d=pv?t.tot-pv.tot:null;
  show(`<section class="hero"><div><p class="eyebrow">Test ${n} · ${new Date(t.date).toLocaleDateString("fr-FR")}</p><div class="score">${t.tot}<small> / 990</small></div>
  <p class="muted">Écoute <b>${t.L}</b> (${t.rl}/100) · Lecture <b>${t.R}</b> (${t.rr}/100)${d!==null?` · <b class="${d>=0?"up":"down"}">${d>=0?"+":""}${d}</b> depuis le test ${prev}`:""}</p>
  <p class="muted small">Score estimé à partir d'une table de conversion approximative : le vrai TOEIC peut varier d'environ 25 points.</p>
  <div class="exrow"><button class="btn" data-act="review" data-n="${n}">Voir la correction</button><button class="btn ghost" data-act="home">Accueil</button></div></div>
  <div class="card"><h3>Résultats par partie</h3>${PARTS.map(p=>{const v=t.parts[p]||[0,1],a=Math.round(v[0]/v[1]*100),o=pv&&pv.parts[p]?Math.round(pv.parts[p][0]/pv.parts[p][1]*100):null;
    return `<div class="pr"><span>${PN[p].replace("Partie ","P")}</span><div class="bar ${isL(p)?"lis":"rea"}"><i style="width:${a}%"></i></div><b>${v[0]}/${v[1]}</b>${o!==null?`<small class="${a>=o?"up":"down"}">${a>=o?"+":""}${a-o}</small>`:"<small></small>"}</div>`}).join("")}</div></section>
  <section><h2>Par quoi commencer</h2><p class="muted">Les parties sont classées selon les points que tu peux gagner et la facilité à progresser. Commence par la n°1.</p>${rs.slice(0,3).map(recCard).join("")}
  <div class="card"><h3>Ordre complet</h3><table class="tbl"><tr><th>Partie</th><th class="n">Réussite</th><th class="n">Points à prendre</th><th>Difficulté</th></tr>${rs.map(o=>`<tr><td>${PN[o.p]}</td><td class="n">${Math.round(o.acc*100)} %</td><td class="n">+${o.pts}</td><td>${easeLabel(o.p)[0]}</td></tr>`).join("")}</table></div></section>`,"home")}
function review(n,filt){const t=ST.tests[n];const T=buildTest(n);const all=[...T.L,...T.R];filt=filt||{p:"all",err:true};
  const gs=all.filter(g=>(filt.p==="all"||g.p===filt.p)&&(!filt.err||g.qs.some(q=>t.ans[q.n]!==q.a)));
  show(`<section><div class="rh"><h2>Correction du test ${n}</h2><button class="btn ghost sm" data-act="results" data-n="${n}">Retour aux résultats</button></div>
  <div class="filters"><select data-in="revp" data-n="${n}"><option value="all">Toutes les parties</option>${PARTS.map(p=>`<option value="${p}" ${filt.p===p?"selected":""}>${PN[p]}</option>`).join("")}</select>
  <label class="row"><input type="checkbox" data-in="reve" data-n="${n}" ${filt.err?"checked":""}> Seulement mes erreurs</label></div>
  ${gs.length?gs.map(g=>`<div class="card">${gHTML(g,t.ans,"V",true)}</div>`).join(""):`<p class="muted">Aucune erreur dans cette sélection.</p>`}</section>`,"home");RV={n,filt}}
let RV=null;

/* ----- exercices ----- */
function exGo(p,i){stopAll();RUN={kind:"ex",p,i,gs:buildEx(p,i),ans:{},gi:0,t0:Date.now(),tok:0};
  $("#app").innerHTML=`<div class="runner"><div class="rtop"><b>${PN[p]} · ${exTitle(p,i)}</b><span class="sp"></span><span id="cd" class="cd"></span><button class="btn sm ghost" data-act="exList">Quitter</button></div><div class="bar"><i id="rbar"></i></div>
  <div class="card tipbox"><b>Méthode :</b> ${METH[p].how.join(" ")}</div><div id="stage"></div></div>`;
  RUN.iv=setInterval(()=>{const c=$("#cd");if(c&&RUN)c.textContent=mmss(Math.round((Date.now()-RUN.t0)/1000))},1000);
  drawEx(true)}
function drawEx(play){const R=RUN,g=R.gs[R.gi],all=g.qs.every(q=>R.ans[q.n]!==undefined),last=R.gi===R.gs.length-1;
  $("#rbar").style.width=(R.gi/R.gs.length*100)+"%";
  $("#stage").innerHTML=`<p class="muted">${isL(R.p)?"Écoute":"Question"} ${R.gi+1} / ${R.gs.length}</p>${gHTML(g,R.ans,"P",false)}
  <div class="rnav">${g.audio&&!textMode()?`<button class="btn ghost" data-act="exReplay">Réécouter</button>`:"<span></span>"}<button class="btn" data-act="exNext" ${all?"":"disabled"}>${last?"Voir mon score":"Suivant"}</button></div>`;
  if(g.audio&&textMode())$("#stage").insertAdjacentHTML("afterbegin",`<div class="trans">${g.audio.map(([s,t])=>`<p>${esc(t)}</p>`).join("")}</div>`);
  if(play&&g.audio&&!textMode())exReplay()}
function exReplay(){const R=RUN;if(!R||!R.gs[R.gi].audio||textMode())return;TTS.stop();const tok=++R.tok;setTimeout(()=>TTS.group(R.gs[R.gi].audio,()=>RUN===R&&R.tok===tok),250)}
function exDone(){const R=RUN,res=evaluate(R.gs,R.ans),c=Object.values(res.parts)[0],pct=Math.round(c[0]/c[1]*100),k=R.p+"-"+R.i,old=ST.ex[k];
  ST.ex[k]={last:pct,best:Math.max(pct,old?old.best:0),date:Date.now(),n:(old?old.n:0)+1};save();
  const min=Math.round((Date.now()-R.t0)/60000),p=R.p,i=R.i,gs=R.gs,ans=R.ans;
  const tags=Object.entries(res.tags).map(([kk,v])=>({tag:kk.split("|")[1],c:v[0],t:v[1]})).sort((a,b)=>a.c/a.t-b.c/b.t);
  const nx=i+1<EXD[p].n?i+1:null;
  show(`<section class="hero"><div><p class="eyebrow">${PN[p]} · ${exTitle(p,i)}</p><div class="score">${pct}<small> %</small></div><p class="muted">${c[0]}/${c[1]} bonnes réponses en ${min} min${old?` · meilleur score avant : ${old.best} %`:""}</p>
  <div class="exrow"><button class="btn" data-act="exGo" data-p="${p}" data-i="${i}">Refaire</button>${nx!==null?`<button class="btn ghost" data-act="exGo" data-p="${p}" data-i="${nx}">Exercice suivant</button>`:""}<button class="btn ghost" data-act="exList">Tous les exercices</button></div></div>
  <div class="card"><h3>Par type de question</h3>${tags.map(t=>`<div class="pr"><span>${tl(t.tag)}</span><div class="bar ${isL(p)?"lis":"rea"}"><i style="width:${t.c/t.t*100}%"></i></div><b>${t.c}/${t.t}</b><small></small></div>`).join("")}
  ${tags[0]&&tags[0].c<tags[0].t&&tip(tags[0].tag)?`<p class="tipbox"><b>Conseil :</b> ${tip(tags[0].tag)}</p>`:""}</div></section>
  <section><h2>Tes erreurs</h2>${gs.filter(g=>g.qs.some(q=>ans[q.n]!==q.a)).map(g=>`<div class="card">${gHTML(g,ans,"V",true)}</div>`).join("")||`<p class="muted">Aucune erreur, bravo.</p>`}</section>`,"exList")}

/* ----- actions ----- */
const ACT={
  home,exList,meth,settings,
  testIntro:d=>testIntro(+d.n),
  startTest:d=>startTest(+d.n,!!d.res),
  results:d=>results(+d.n),review:d=>review(+d.n),
  ans:(d,b)=>{if(!RUN)return;RUN.ans[+d.q]=+d.i;b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));persist();
    if(RUN.phase==="R"){const answered=Object.keys(RUN.ans).filter(k=>k>100).length;$("#rinfo").textContent=$("#rinfo").textContent.replace(/\d+\/100 répondues/,answered+"/100 répondues");$("#rbar").style.width=answered+"%";document.querySelectorAll(".pb").forEach(p=>{if(+p.textContent===+d.q)p.classList.add("a")})}},
  skip:()=>{if(RUN&&RUN.skip)RUN.skip()},
  pause:(d,b)=>{const R=RUN;if(!R||R.phase!=="L")return;if(R.paused){R.paused=false;b.textContent="Pause";listenLoop()}else{R.paused=true;R.tok++;clearInterval(R.cdv);TTS.stop();b.textContent="Reprendre";$("#cd").textContent="En pause : la question reprendra depuis le début"}},
  readGo,
  rnav:d=>{RUN.ri=Math.max(0,Math.min(RUN.R.length-1,RUN.ri+ +d.d));drawR();window.scrollTo(0,0)},
  rgo:d=>{RUN.ri=+d.g;drawR();window.scrollTo(0,0)},
  finAsk:()=>{const left=100-Object.keys(RUN.ans).filter(k=>k>100).length;$("#fin").innerHTML=`<div class="warn">${left?`Il reste ${left} question${left>1?"s":""} sans réponse. `:""}Terminer le test maintenant ? <button class="btn sm" data-act="finYes">Oui, terminer</button> <button class="btn sm ghost" data-act="finNo">Continuer</button></div>`},
  finYes:()=>finishTest(),finNo:()=>{$("#fin").innerHTML=""},
  exGo:d=>exGo(d.p,+d.i),
  exAns:(d)=>{const R=RUN;if(!R||R.ans[+d.q]!==undefined)return;R.ans[+d.q]=+d.i;drawEx(false);const el=$("#q"+d.q);if(el&&el.scrollIntoView&&R.gs[R.gi].qs.length>1)el.scrollIntoView({block:"nearest"})},
  exReplay,
  exNext:()=>{const R=RUN;TTS.stop();R.tok++;if(R.gi<R.gs.length-1){R.gi++;drawEx(true);window.scrollTo(0,0)}else exDone()},
  testVoice:async()=>{TTS.stop();const v=TTS.assign();await TTS.say("Hello, I'm calling about the meeting on Tuesday.",v.W);await TTS.say("No problem. Would Thursday work for you instead?",v.M)},
  exp:()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(ST)],{type:"application/json"}));a.download="toeic-resultats.json";document.body.appendChild(a);a.click();a.remove()}catch(e){$("#msg").textContent="Export impossible dans ce navigateur."}},
  reset:(d,b)=>{if(b.dataset.armed){localStorage.removeItem(KEY);ST=load();settings();$("#msg").textContent="Toutes les données ont été effacées."}else{b.dataset.armed=1;b.textContent="Confirmer : tout effacer ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Tout effacer"}},4000)}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.in==="rate"){ST.set.rate=+t.value;$("#rv").textContent=t.value;save()}});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==="text"){ST.set.text=t.checked;save()}
  if(k==="revp"||k==="reve"){const f=Object.assign({},RV.filt);if(k==="revp")f.p=t.value;else f.err=t.checked;review(+t.dataset.n,f)}
  if(k==="imp"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.tests)throw 0;localStorage.setItem(KEY,JSON.stringify(d));ST=load();settings();$("#msg").textContent="Résultats importés."}catch(er){$("#msg").textContent="Fichier non reconnu."}};fr.readAsText(t.files[0])}});
TTS.init();home();

</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
